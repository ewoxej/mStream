name: Docker

# The mstream-zenelo image (Dockerfile at the repo root) on GitHub Packages:
# ghcr.io/<owner>/mstream-zenelo.
#
# Manual only (Actions → Docker → Run workflow, or `gh workflow run docker.yml`):
# unit tests, then the image of the chosen branch tagged `edge` (master only)
# and `sha-<short>`.
#
# Versioned images (`1.2.3`, `1.2`, `latest`) come from docker-release.yml.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: mstream-zenelo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The unit tests need ffmpeg in bin/ffmpeg (image-thumbs encodes real
      # images): the same pinned, checksum-verified BtbN build as test.yml —
      # bump them together.
      - name: Install ffmpeg
        run: |
          tag='autobuild-2026-06-30-13-34'
          build='ffmpeg-n8.1.2-21-gce3c09c101-linux64-gpl-8.1'
          sha256='0ba73bbd93472c7622f6dec26d334c5e62e64d858d072490b2844320970456cd'
          curl -fsSL --retry 3 --retry-delay 5 -o "$build.tar.xz" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/$tag/$build.tar.xz"
          echo "$sha256  $build.tar.xz" | sha256sum -c - \
            || { echo "::error::ffmpeg download checksum mismatch"; exit 1; }
          tar -xf "$build.tar.xz"
          mkdir -p bin/ffmpeg
          cp "$build/bin/ffmpeg" "$build/bin/ffprobe" bin/ffmpeg/
          chmod +x bin/ffmpeg/ffmpeg bin/ffmpeg/ffprobe
          rm -rf "$build.tar.xz" "$build"
      - run: npm run test:unit

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=$VERSION-edge.$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=master
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=mstream-zenelo
            org.opencontainers.image.version=${{ env.VERSION }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
