name: Docker

# The mstream-zenelo image (Dockerfile at the repo root) on GitHub Packages:
# ghcr.io/<owner>/mstream-zenelo.
#
# - push to master: unit tests, then the image tagged `edge` and `sha-<short>`
# - pull request:   unit tests and a build of the image, nothing pushed
# - manual run:     the same as a push (an edge image of the chosen branch)
#
# Versioned images (`1.2.3`, `1.2`, `latest`) come from docker-release.yml.

on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: mstream-zenelo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=$VERSION-edge.$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Packages
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=master
            type=sha,prefix=sha-
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=mstream-zenelo
            org.opencontainers.image.version=${{ env.VERSION }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
