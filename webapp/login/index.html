<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/fav/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/fav/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/fav/favicon-16x16.png">
  <link rel="manifest" href="../assets/fav/site.webmanifest">
  <link rel="mask-icon" href="../assets/fav/safari-pinned-tab.svg" color="#d4a24c">
  <link rel="shortcut icon" href="../assets/fav/favicon.ico">
  <meta name="msapplication-TileColor" content="#0d0e0b">
  <meta name="msapplication-config" content="../assets/fav/browserconfig.xml">
  <meta name="theme-color" content="#0d0e0b">
  <meta name="i18n-base" content="../">
  <script src="../assets/js/i18n.js"></script>
  <script>I18N.loadLanguage(I18N.detectLanguage());</script>
  <script defer src="../assets/js/lib/axios.js"></script>
  <script defer src="../assets/js/api.js"></script>
  <script defer src="index.js"></script>
  <link rel="stylesheet" href="../assets/fonts/plex.css">
  <!-- The player's look (webapp/app): olive-black, mustard action, IBM Plex. -->
  <style>
    :root {
      --bg: #0d0e0b; --card: #181a15; --inset: #121410; --border: #2a2d24;
      --tx: #f4f4ee; --tx2: #aeb0a0; --tx3: #7f8274;
      --accent: #d4a24c; --accent-alt: #e2b567; --on-accent: #170f03;
      --accent-14: rgba(212, 162, 76, .14); --accent-30: rgba(212, 162, 76, .3);
      --danger: #e0685f;
      --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--tx); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; font-size: 13.5px; }
    .login { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 22px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 40px; height: 40px; border-radius: 11px; background: var(--accent-14); color: var(--accent); display: flex; align-items: center; justify-content: center; flex: none; }
    .brand .micro { display: block; margin-top: 2px; }
    .brand b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
    .micro { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--tx3); }
    .card { padding: 22px; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 1px var(--border); display: flex; flex-direction: column; gap: 16px; }
    .card h1 { margin: 0; font-size: 17px; font-weight: 600; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field input {
      height: 40px; padding: 0 12px; border: 0; border-radius: 10px; outline: 0;
      background: var(--inset); box-shadow: inset 0 0 0 1px var(--border); color: var(--tx);
      font: inherit; font-size: 14px; transition: box-shadow .12s;
    }
    .field input:focus { box-shadow: inset 0 0 0 1px rgba(212, 162, 76, .55); }
    .field:focus-within .micro { color: var(--accent); }
    button {
      height: 40px; margin-top: 4px; border: 0; border-radius: 10px; cursor: pointer;
      background: var(--accent); color: var(--on-accent); font: inherit; font-size: 14px; font-weight: 600;
      transition: background .12s, transform .1s;
    }
    button:hover { background: var(--accent-alt); }
    button:active { transform: scale(.985); }
    button:disabled { opacity: .55; cursor: default; }
    :focus-visible { outline: 2px solid var(--accent-30); outline-offset: 1px; }
    .sso { display: flex; align-items: center; justify-content: center; gap: 8px; height: 40px; border-radius: 10px; text-decoration: none;
      background: var(--inset); box-shadow: inset 0 0 0 1px var(--border); color: var(--tx); font-size: 14px; font-weight: 600; transition: background .12s; }
    .sso:hover { background: #20231c; }
    .sso.primary { background: var(--accent); color: var(--on-accent); box-shadow: none; }
    .sso.primary:hover { background: var(--accent-alt); }
    .or { display: flex; align-items: center; gap: 10px; }
    .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    [hidden] { display: none !important; }
    .error { min-height: 18px; margin: -6px 0 0; font-size: 12.5px; color: var(--danger); }
    .error:empty { display: none; }
  </style>
</head>
<body>
  <main class="login">
    <div class="brand">
      <div class="brand-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 18c.55 0 1-.45 1-1V7c0-.55-.45-1-1-1s-1 .45-1 1v10c0 .55.45 1 1 1zm4 4c.55 0 1-.45 1-1V3c0-.55-.45-1-1-1s-1 .45-1 1v18c0 .55.45 1 1 1zm-8-8c.55 0 1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1v2c0 .55.45 1 1 1zm12 4c.55 0 1-.45 1-1V7c0-.55-.45-1-1-1s-1 .45-1 1v10c0 .55.45 1 1 1zm3-7v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg></div>
      <div><b>mStream</b><span class="micro" id="server-name"></span></div>
    </div>
    <form id="login" class="card">
      <h1 data-i18n="login.title">Login</h1>
      <label class="field">
        <span class="micro" data-i18n="login.username">Username</span>
        <input id="email" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus>
      </label>
      <label class="field">
        <span class="micro" data-i18n="login.password">Password</span>
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="error" id="login-error" role="alert"></p>
      <button type="submit" id="form-submit" data-i18n="login.submit">Login</button>
      <div id="sso" hidden>
        <div class="or micro" id="sso-or">or</div>
        <a class="sso" id="sso-link" href="../api/v1/auth/oidc/start"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.65 10A5.99 5.99 0 0 0 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6a5.99 5.99 0 0 0 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg><span id="sso-label">Sign in with SSO</span></a>
      </div>
    </form>
  </main>
</body>
</html>
